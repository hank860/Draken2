<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Draken AI</title>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Rajdhani:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #050508;
      --surface: #0e0e16;
      --surface2: #0d1117;
      --border: #1e2a1e;
      --accent: #00ff88;
      --accent2: #00cc6a;
      --accent3: #00ffaa;
      --text: #e2e8f0;
      --muted: #64748b;
      --user-bubble: #0a1f0a;
      --ai-bubble: #0e0e16;
      --glow: rgba(0,255,136,0.25);
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: 'Rajdhani', sans-serif;
      background: var(--bg);
      color: var(--text);
      height: 100vh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      background-image:
        radial-gradient(ellipse at 10% 0%, rgba(0,255,136,0.08) 0%, transparent 50%),
        radial-gradient(ellipse at 90% 100%, rgba(0,204,106,0.05) 0%, transparent 50%);
    }

    /* GRID BACKGROUND */
    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background-image:
        linear-gradient(rgba(0,255,136,0.03) 1px, transparent 1px),
        linear-gradient(90deg, rgba(0,255,136,0.03) 1px, transparent 1px);
      background-size: 40px 40px;
      pointer-events: none;
      z-index: 0;
    }

    /* HEADER */
    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 16px 24px;
      border-bottom: 1px solid var(--border);
      background: rgba(14,14,22,0.9);
      backdrop-filter: blur(20px);
      position: relative;
      z-index: 10;
      flex-shrink: 0;
    }

    .logo {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .logo-icon {
      width: 44px;
      height: 44px;
      background: #0d1117;
      border: 1px solid var(--accent);
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: 'Orbitron', monospace;
      font-size: 11px;
      font-weight: 900;
      color: var(--accent);
      letter-spacing: 0px;
      box-shadow: 0 0 20px var(--glow), inset 0 0 15px rgba(0,255,136,0.05);
      animation: glowPulse 3s ease infinite;
    }

    .logo-text {
      font-family: 'Orbitron', monospace;
      font-size: 18px;
      font-weight: 900;
      color: var(--accent);
      letter-spacing: 3px;
      text-shadow: 0 0 20px rgba(0,255,136,0.5);
    }

    .logo-sub {
      font-size: 10px;
      color: var(--muted);
      letter-spacing: 3px;
      text-transform: uppercase;
      font-family: 'Orbitron', monospace;
    }

    .status {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 12px;
      color: var(--muted);
      font-family: 'Orbitron', monospace;
    }

    .status-dot {
      width: 8px;
      height: 8px;
      background: #10b981;
      border-radius: 50%;
      animation: pulse 2s infinite;
      box-shadow: 0 0 8px #10b981;
    }

    /* CHAT AREA */
    .chat-area {
      flex: 1;
      overflow-y: auto;
      padding: 24px;
      display: flex;
      flex-direction: column;
      gap: 20px;
      position: relative;
      z-index: 1;
    }

    .chat-area::-webkit-scrollbar { width: 4px; }
    .chat-area::-webkit-scrollbar-track { background: transparent; }
    .chat-area::-webkit-scrollbar-thumb { background: var(--border); border-radius: 99px; }

    /* WELCOME */
    .welcome {
      text-align: center;
      padding: 40px 20px;
      animation: fadeUp 0.6s ease both;
    }

    .welcome-icon {
      font-size: 48px;
      margin-bottom: 16px;
      display: block;
      animation: float 3s ease infinite;
    }

    .welcome h2 {
      font-family: 'Orbitron', monospace;
      font-size: clamp(20px, 4vw, 32px);
      font-weight: 900;
      color: var(--accent);
      text-shadow: 0 0 30px rgba(0,255,136,0.4);
      margin-bottom: 10px;
    }

    .welcome p {
      color: var(--muted);
      font-size: 15px;
      max-width: 400px;
      margin: 0 auto 28px;
      line-height: 1.6;
    }

    .suggestions {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      justify-content: center;
      max-width: 600px;
      margin: 0 auto;
    }

    .suggestion {
      background: #0d1117;
      border: 1px solid rgba(0,255,136,0.2);
      color: var(--text);
      font-family: 'Rajdhani', sans-serif;
      font-size: 13px;
      font-weight: 500;
      padding: 10px 16px;
      border-radius: 10px;
      cursor: pointer;
      transition: all 0.2s;
      text-align: left;
    }

    .suggestion:hover {
      border-color: var(--accent);
      background: rgba(0,255,136,0.05);
      color: var(--accent);
      transform: translateY(-2px);
      box-shadow: 0 4px 15px var(--glow);
    }

    /* MESSAGES */
    .message {
      display: flex;
      gap: 12px;
      animation: fadeUp 0.3s ease both;
      max-width: 800px;
    }

    .message.user {
      flex-direction: row-reverse;
      margin-left: auto;
    }

    .avatar {
      width: 36px;
      height: 36px;
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 16px;
      flex-shrink: 0;
    }

    .avatar.ai {
      background: linear-gradient(135deg, var(--accent), var(--accent3));
      box-shadow: 0 0 15px var(--glow);
    }

    .avatar.user {
      background: var(--surface2);
      border: 1px solid var(--border);
    }

    .bubble {
      padding: 14px 18px;
      border-radius: 16px;
      font-size: 15px;
      line-height: 1.7;
      max-width: calc(100% - 50px);
    }

    .bubble.ai {
      background: var(--ai-bubble);
      border: 1px solid var(--border);
      border-radius: 4px 16px 16px 16px;
    }

    .bubble.user {
      background: var(--user-bubble);
      border: 1px solid rgba(124,58,237,0.3);
      border-radius: 16px 4px 16px 16px;
      color: #c4b5fd;
    }

    .bubble pre {
      background: #0d1117;
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 16px;
      margin-top: 12px;
      font-family: 'Courier New', monospace;
      font-size: 13px;
      overflow-x: auto;
      white-space: pre-wrap;
      word-break: break-word;
      color: #7ee787;
      line-height: 1.6;
    }

    /* TYPING */
    .typing {
      display: flex;
      gap: 5px;
      align-items: center;
      padding: 4px 0;
    }

    .typing span {
      width: 8px;
      height: 8px;
      background: var(--accent2);
      border-radius: 50%;
      animation: bounce 1.2s infinite;
    }

    .typing span:nth-child(2) { animation-delay: 0.2s; }
    .typing span:nth-child(3) { animation-delay: 0.4s; }

    /* INPUT AREA */
    .input-area {
      padding: 16px 24px 24px;
      border-top: 1px solid var(--border);
      background: rgba(14,14,22,0.95);
      backdrop-filter: blur(20px);
      position: relative;
      z-index: 10;
      flex-shrink: 0;
    }

    .input-wrap {
      display: flex;
      gap: 12px;
      align-items: flex-end;
      max-width: 800px;
      margin: 0 auto;
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 12px 16px;
      transition: border-color 0.2s, box-shadow 0.2s;
    }

    .input-wrap:focus-within {
      border-color: var(--accent);
      box-shadow: 0 0 0 3px rgba(124,58,237,0.1);
    }

    textarea#msgInput {
      flex: 1;
      background: transparent;
      border: none;
      outline: none;
      color: var(--text);
      font-family: 'Rajdhani', sans-serif;
      font-size: 15px;
      font-weight: 500;
      resize: none;
      max-height: 120px;
      line-height: 1.5;
    }

    textarea#msgInput::placeholder { color: var(--muted); }

    .send-btn {
      width: 40px;
      height: 40px;
      background: linear-gradient(135deg, var(--accent), var(--accent3));
      border: none;
      border-radius: 10px;
      color: #fff;
      font-size: 18px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.2s;
      flex-shrink: 0;
      box-shadow: 0 4px 15px var(--glow);
    }

    .send-btn:hover { transform: scale(1.05); }
    .send-btn:active { transform: scale(0.95); }
    .send-btn:disabled { opacity: 0.4; cursor: not-allowed; transform: none; }

    .input-hint {
      text-align: center;
      font-size: 11px;
      color: var(--muted);
      margin-top: 10px;
      font-family: 'Orbitron', monospace;
      letter-spacing: 1px;
    }

    /* ANIMATIONS */
    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(16px); }
      to { opacity: 1; transform: translateY(0); }
    }

    @keyframes pulse {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.5; transform: scale(0.8); }
    }

    @keyframes glowPulse {
      0%, 100% { box-shadow: 0 0 20px var(--glow); }
      50% { box-shadow: 0 0 35px var(--glow), 0 0 60px rgba(6,182,212,0.15); }
    }

    @keyframes bounce {
      0%, 80%, 100% { transform: translateY(0); }
      40% { transform: translateY(-8px); }
    }

    @keyframes float {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-8px); }
    }

    @media(max-width: 600px) {
      .header { padding: 12px 16px; }
      .chat-area { padding: 16px; }
      .input-area { padding: 12px 16px 20px; }
    }
  </style>
</head>
<body>

<!-- HEADER -->
<div class="header">
  <div class="logo">
    <div class="logo-icon">D·AI</div>
    <div>
      <div class="logo-text">DRAKEN AI</div>
      <div class="logo-sub">// WHITE HAT EDITION</div>
    </div>
  </div>
  <div class="status">
    <div class="status-dot"></div>
    EN LIGNE
  </div>
</div>

<!-- CHAT -->
<div class="chat-area" id="chatArea">
  <div class="welcome" id="welcome">
    <span class="welcome-icon">🐉</span>
    <h2>Bonjour, je suis Draken AI</h2>
    <p>Votre assistant intelligent. Posez-moi n'importe quelle question — science, code, technologie, ou autre chose !</p>
    <div class="suggestions">
      <button class="suggestion" onclick="suggest('Explique moi comment fonctionne le transistor')">⚡ Comment fonctionne le transistor ?</button>
      <button class="suggestion" onclick="suggest('Crée moi un code Python pour calculer la moyenne')">🐍 Code Python pour calculer la moyenne</button>
      <button class="suggestion" onclick="suggest('Explique la relativité d Einstein simplement')">🌌 Relativité d'Einstein simplement</button>
      <button class="suggestion" onclick="suggest('Comment apprendre la programmation en partant de zéro')">💻 Apprendre la programmation</button>
    </div>
  </div>
</div>

<!-- INPUT -->
<div class="input-area">
  <div class="input-wrap">
    <textarea id="msgInput" placeholder="Posez votre question à Draken AI..." rows="1"
      onkeydown="handleKey(event)" oninput="autoResize(this)"></textarea>
    <button class="send-btn" id="sendBtn" onclick="sendMessage()">➤</button>
  </div>
  <div class="input-hint">DRAKEN AI — PROPULSÉ PAR CLAUDE</div>
</div>

<script>
  const chatArea = document.getElementById('chatArea');
  const msgInput = document.getElementById('msgInput');
  const sendBtn = document.getElementById('sendBtn');
  let history = [];
  let isTyping = false;

  function autoResize(el) {
    el.style.height = 'auto';
    el.style.height = Math.min(el.scrollHeight, 120) + 'px';
  }

  function handleKey(e) {
    if (e.key === 'Enter' && !e.shiftKey) {
      e.preventDefault();
      sendMessage();
    }
  }

  function suggest(text) {
    msgInput.value = text;
    sendMessage();
  }

  function hideWelcome() {
    const welcome = document.getElementById('welcome');
    if (welcome) welcome.remove();
  }

  function addMessage(role, content, isLoading = false) {
    hideWelcome();
    const div = document.createElement('div');
    div.className = `message ${role}`;

    const avatar = document.createElement('div');
    avatar.className = `avatar ${role}`;
    if (role === 'ai') {
      avatar.textContent = 'D';
      avatar.style.fontFamily = 'Orbitron, monospace';
      avatar.style.fontSize = '16px';
      avatar.style.fontWeight = '900';
      avatar.style.color = '#00ff88';
      avatar.style.background = '#0d1117';
      avatar.style.border = '1px solid #00ff88';
      avatar.style.boxShadow = '0 0 10px rgba(0,255,136,0.3)';
    } else {
      avatar.textContent = '👤';
    }

    const bubble = document.createElement('div');
    bubble.className = `bubble ${role}`;

    if (isLoading) {
      bubble.innerHTML = `<div class="typing"><span></span><span></span><span></span></div>`;
      div.id = 'typingMsg';
    } else {
      // Formater le code
      const formatted = content.replace(/```(\w*)\n?([\s\S]*?)```/g, (_, lang, code) => {
        return `<pre>${escapeHtml(code.trim())}</pre>`;
      }).replace(/\n/g, '<br>');
      bubble.innerHTML = formatted;
    }

    div.appendChild(avatar);
    div.appendChild(bubble);
    chatArea.appendChild(div);
    chatArea.scrollTop = chatArea.scrollHeight;
    return div;
  }

  function escapeHtml(text) {
    return text.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
  }

  async function sendMessage() {
    const text = msgInput.value.trim();
    if (!text || isTyping) return;

    isTyping = true;
    sendBtn.disabled = true;
    msgInput.value = '';
    msgInput.style.height = 'auto';

    addMessage('user', text);
    history.push({ role: 'user', content: text });

    const typingEl = addMessage('ai', '', true);

    try {
      const response = await fetch("/.netlify/functions/chat", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ messages: history })
      });

      const data = await response.json();
      const reply = data.reply;

      typingEl.remove();
      addMessage('ai', reply);
      history.push({ role: 'assistant', content: reply });

    } catch (err) {
      typingEl.remove();
      addMessage('ai', '❌ Erreur de connexion. Vérifiez votre connexion internet et réessayez.');
    }

    isTyping = false;
    sendBtn.disabled = false;
    msgInput.focus();
  }
</script>

</body>
</html>
